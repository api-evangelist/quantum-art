openapi: 3.2.0
info:
  title: QaaS Backend Artifacts API
  description: Quantum-as-a-Service Backend providing task management, metrics, and real-time communication
  version: 1.0.0
tags:
- name: Artifacts
paths:
  /api/artifacts/download:
    get:
      summary: Download Artifact
      description: 'Download artifact by reference.


        Args:

        artifact_ref: URL-encoded artifact reference (S3 path or local file path)

        current_user: Authenticated user from JWT token


        Returns:

        StreamingResponse with file content


        Security:

        - Validates user has access to the task that owns the artifact

        - Extracts task_id from artifact_ref path

        - Checks user is task owner or admin'
      operationId: download_artifact_api_artifacts_download_get
      security:
      - HTTPBearer: []
      parameters:
      - name: artifact_ref
        in: query
        required: true
        schema:
          type: string
          title: Artifact Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Artifacts
  /api/artifacts/view:
    get:
      summary: View Artifact
      description: 'View artifact content as text.


        Args:

        artifact_ref: URL-encoded artifact reference (S3 path or local file path)

        current_user: Authenticated user from JWT token


        Returns:

        JSON response with filename and content as text


        Security:

        - Same authorization as download endpoint

        - Content limited to text files'
      operationId: view_artifact_api_artifacts_view_get
      security:
      - HTTPBearer: []
      parameters:
      - name: artifact_ref
        in: query
        required: true
        schema:
          type: string
          title: Artifact Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Artifacts
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer

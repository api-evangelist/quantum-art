aid: quantum-art
name: Quantum Art
description: >-
  Quantum Art is a quantum computing company building best-in-class, scalable
  quantum computers for commercial applications. Its technology combines advanced
  multi-qubit gates that implement up to 1,000 standard two-qubit operations in a
  single action with a dynamically reconfigurable multi-core trapped-ion
  architecture that runs tens of independent cores in parallel with microsecond
  reconfiguration. Quantum Art targets chemistry and materials science, machine
  learning, process optimization, and finance. It exposes its systems through a
  Quantum-as-a-Service (QaaS) platform whose QaaS Backend API offers a
  Qiskit-provider-compatible interface for listing backends, submitting and
  managing quantum jobs, retrieving results, plus account, task, artifact, and
  administration management. Backed by Battery Ventures.
